<div class="chat-wrapper d-flex flex-column flex-md-row">
    <!-- Sidebar -->
    <aside class="chat-sidebar border-end d-flex flex-column bg-white">
        <!-- Sidebar Header -->
        <div class="p-4 border-bottom d-flex align-items-center justify-content-between">
            <h5 class="mb-0 fw-bold">ChatApp</h5>
            <div class="dropdown">
                <button class="btn btn-link link-dark p-0" data-bs-toggle="dropdown">
                    <i class="bi bi-three-dots-vertical"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="/logout">Logout</a></li>
                </ul>
            </div>
        </div>

        <!-- Tabs -->
        <ul class="nav nav-tabs nav-fill border-0 px-3 mt-2" id="sidebarTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active small fw-bold py-3" id="chats-tab" data-bs-toggle="tab"
                    data-bs-target="#chats" type="button">CHATS</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link small fw-bold py-3" id="friends-tab" data-bs-toggle="tab"
                    data-bs-target="#friends" type="button">FRIENDS</button>
            </li>
        </ul>

        <div class="tab-content flex-grow-1 overflow-auto">
            <!-- Chats Tab -->
            <div class="tab-pane fade show active" id="chats" role="tabpanel">
                <div class="list-group list-group-flush" id="conversation-list">
                    {{if .Conversations}}
                    {{range .Conversations}}
                    <button
                        class="list-group-item list-group-item-action p-3 border-0 d-flex align-items-center gap-3 conversation-item"
                        onclick="loadConversation('{{.ID}}', '{{.OtherUserName}}', '{{.OtherUserEmail}}', '{{.OtherUserID}}')">
                        <div class="avatar bg-primary text-white rounded-circle flex-shrink-0"
                            style="width: 48px; height: 48px;">
                            <img src="https://i.pravatar.cc/150?u={{.OtherUserEmail}}"
                                class="rounded-circle w-100 h-100">
                        </div>
                        <div class="flex-grow-1 min-w-0 text-start">
                            <div class="d-flex justify-content-between">
                                <h6 class="mb-0 text-truncate fw-bold">{{.OtherUserName}}</h6>
                                <span class="extra-small text-muted">{{.LastMessageTime.Format "15:04"}}</span>
                            </div>
                            <p class="mb-0 text-truncate small text-muted">{{.LastMessage}}</p>
                        </div>
                    </button>
                    {{end}}
                    {{else}}
                    <div class="p-4 text-center text-muted small">No conversations yet. Start a new one from Friends!
                    </div>
                    {{end}}
                </div>
            </div>

            <!-- Friends Tab -->
            <div class="tab-pane fade" id="friends" role="tabpanel">
                <div class="list-group list-group-flush">
                    {{range .Users}}
                    <button
                        class="list-group-item list-group-item-action p-3 border-0 d-flex align-items-center gap-3 friend-item"
                        onclick="startPrivateChat('{{.ID}}', '{{.Username}}', '{{.Email}}')">
                        <div class="avatar bg-secondary text-white rounded-circle flex-shrink-0"
                            style="width: 40px; height: 40px;">
                            <img src="https://i.pravatar.cc/150?u={{.Email}}" class="rounded-circle w-100 h-100">
                        </div>
                        <div class="flex-grow-1 text-start">
                            <h6 class="mb-0 small fw-bold">{{.Username}}</h6>
                            <span class="extra-small text-muted">Available</span>
                        </div>
                    </button>
                    {{end}}
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Chat -->
    <main class="chat-main d-flex flex-column flex-grow-1 bg-light" id="chat-main-area">
        <!-- Empty State -->
        <div id="empty-chat"
            class="flex-grow-1 d-flex flex-column align-items-center justify-content-center text-center p-5">
            <div class="mb-4 bg-white rounded-circle shadow-sm d-flex align-items-center justify-content-center"
                style="width: 120px; height: 120px;">
                <i class="bi bi-chat-dots-fill text-primary display-4"></i>
            </div>
            <h4>Welcome to ChatApp</h4>
            <p class="text-muted">Select a conversation or a friend to start messaging.</p>
        </div>

        <!-- Chat View (Hidden by default) -->
        <div id="active-chat" class="d-none flex-column flex-grow-1">
            <div class="p-3 border-bottom bg-white d-flex align-items-center justify-content-between px-md-4">
                <div class="d-flex align-items-center gap-3">
                    <div class="avatar" style="width: 40px; height: 40px;">
                        <img id="chat-header-avatar" src="" class="rounded-circle w-100 h-100">
                    </div>
                    <div>
                        <h6 id="chat-header-name" class="mb-0 fw-bold">Recipient Name</h6>
                        <span class="text-success extra-small">Online</span>
                    </div>
                </div>
            </div>

            <div class="flex-grow-1 overflow-auto p-4 d-flex flex-column gap-3" id="message-container">
                <!-- Messages will be injected here -->
            </div>

            <div class="p-3 bg-white border-top">
                <form id="chat-form" class="d-flex gap-2">
                    <input type="text" id="message-input" class="form-control rounded-pill px-4"
                        placeholder="Type a message..." autocomplete="off">
                    <button type="submit" class="btn btn-primary rounded-circle shadow-sm"
                        style="width: 48px; height: 48px;">
                        <i class="bi bi-send-fill"></i>
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
    .chat-wrapper {
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        font-family: 'Inter', sans-serif;
    }

    .chat-sidebar {
        width: 100%;
        max-width: 350px;
        flex-shrink: 0;
    }

    .nav-tabs .nav-link {
        border: none;
        color: #6c757d;
        border-bottom: 2px solid transparent;
    }

    .nav-tabs .nav-link.active {
        color: var(--bs-primary);
        border-bottom-color: var(--bs-primary);
        background: transparent;
    }

    .conversation-item,
    .friend-item {
        transition: all 0.2s;
        cursor: pointer;
    }

    .conversation-item:hover,
    .friend-item:hover {
        background-color: #f8f9fa;
    }

    .extra-small {
        font-size: 0.75rem;
    }

    #message-container {
        scroll-behavior: smooth;
    }

    .message-bubble {
        max-width: 75%;
        padding: 10px 16px;
        border-radius: 18px;
        font-size: 0.95rem;
    }

    .message-sent {
        align-self: flex-end;
        background-color: var(--bs-primary);
        color: white;
        border-bottom-right-radius: 4px;
    }

    .message-received {
        align-self: flex-start;
        background-color: #e9ecef;
        color: #212529;
        border-bottom-left-radius: 4px;
    }

    @media (max-width: 768px) {
        .chat-sidebar {
            max-width: 100%;
            height: 40%;
        }

        .chat-main {
            height: 60%;
        }
    }
</style>

<script>
    const currentUserID = '{{.CurrentUserID}}';
    const csrfToken = '{{._csrf}}';
    let currentConversationID = null;
    let currentReceiverID = null;
    let socket = null;

    function connectWS() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        socket = new WebSocket(`${protocol}//${window.location.host}/ws?user_id=${currentUserID}`);

        socket.onmessage = function (event) {
            const data = JSON.parse(event.data);
            if (data.type === 'text' && data.conversation_id === currentConversationID) {
                appendMessage(data);
            }
        };

        socket.onclose = function () {
            setTimeout(connectWS, 1000); // Reconnect
        };
    }

    async function startPrivateChat(userId, username, email) {
        const response = await fetch(`/conversations/private/${userId}`, {
            method: 'POST',
            headers: {
                'X-Csrf-Token': csrfToken
            }
        });
        const data = await response.json();

        // Switch to chats tab
        const chatsTab = document.getElementById('chats-tab');
        const tab = new bootstrap.Tab(chatsTab);
        tab.show();

        loadConversation(data.conversation_id, username, email, userId);
    }

    async function loadConversation(id, name, email, receiverID) {
        currentConversationID = id;
        currentReceiverID = receiverID;

        document.getElementById('empty-chat').classList.add('d-none');
        const activeChat = document.getElementById('active-chat');
        activeChat.classList.remove('d-none');
        activeChat.classList.add('d-flex');

        document.getElementById('chat-header-name').innerText = name;
        document.getElementById('chat-header-avatar').src = `https://i.pravatar.cc/150?u=${email}`;

        const container = document.getElementById('message-container');
        container.innerHTML = '<div class="text-center text-muted extra-small">Loading messages...</div>';

        const response = await fetch(`/conversations/${id}/messages`);
        const messages = await response.json();

        container.innerHTML = '';
        if (messages) {
            messages.forEach(msg => {
                appendMessage({
                    content: msg.content,
                    sender_id: msg.sender_id,
                    type: 'text'
                });
            });
        }
    }

    function appendMessage(msg) {
        const container = document.getElementById('message-container');
        const div = document.createElement('div');
        const isSent = msg.sender_id === currentUserID;

        div.className = `message-bubble ${isSent ? 'message-sent' : 'message-received shadow-sm'}`;
        div.innerText = msg.content;

        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    document.getElementById('chat-form').onsubmit = function (e) {
        e.preventDefault();
        const input = document.getElementById('message-input');
        const content = input.value.trim();

        if (content && currentConversationID && socket && currentReceiverID) {
            const msg = {
                type: 'text',
                conversation_id: currentConversationID,
                receiver_id: currentReceiverID,
                sender_id: currentUserID,
                content: content
            };

            socket.send(JSON.stringify(msg));
            input.value = '';
        }
    };

    connectWS();
</script>
